<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070e1c"/>
      <stop offset="100%" stop-color="#0d1a30"/>
    </linearGradient>
    <linearGradient id="gapGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c4a6e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#14532d" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="winGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.03"/>
    </radialGradient>
    <filter id="btnGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="sparkleGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Open gap — outside light visible where door is ajar (sky blue → ground green) -->
  <rect x="122" y="98" width="22" height="308" rx="4" fill="url(#gapGrad)"/>

  <!-- Hinge top — bridges gap to door panel -->
  <rect x="119" y="142" width="36" height="14" rx="5" fill="#38bdf8" opacity="0.46"/>
  <!-- Hinge bottom -->
  <rect x="119" y="258" width="36" height="14" rx="5" fill="#38bdf8" opacity="0.46"/>

  <!-- Door panel -->
  <rect x="152" y="90" width="224" height="324" rx="18" fill="#0c1e3a"/>
  <rect x="152" y="90" width="224" height="324" rx="18"
        fill="none" stroke="#38bdf8" stroke-width="4.5" opacity="0.65"/>

  <!-- Door left-edge depth strip (3D thickness, door is open toward viewer) -->
  <rect x="152" y="90" width="7" height="324" rx="0" fill="#1a4a7c" opacity="0.45"/>

  <!-- Car door mirror housing (attached to door top-left) -->
  <path d="M 116,152 L 152,148 L 152,170 L 116,166 Z"
        fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.60"/>

  <!-- Window area -->
  <rect x="170" y="110" width="188" height="112" rx="12" fill="url(#winGlow)"/>
  <rect x="170" y="110" width="188" height="112" rx="12"
        fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.55"/>

  <!-- Car silhouette visible through window (ghost, 14% opacity) -->
  <path d="M186,214 L186,200 Q186,196 190,196 L214,196 L227,181
           Q231,177 237,177 L291,177 Q297,177 301,181 L314,196
           L338,196 Q342,196 342,200 L342,215 Z"
        fill="#38bdf8" opacity="0.14"/>
  <circle cx="214" cy="215" r="11" fill="#0a1628" stroke="#38bdf8" stroke-width="1" opacity="0.2"/>
  <circle cx="318" cy="215" r="11" fill="#0a1628" stroke="#38bdf8" stroke-width="1" opacity="0.2"/>

  <!-- Window glass glint -->
  <line x1="183" y1="120" x2="212" y2="158" stroke="white" stroke-width="2"
        stroke-linecap="round" opacity="0.07"/>

  <!-- Divider: window → keypad -->
  <line x1="170" y1="234" x2="358" y2="234" stroke="#38bdf8" stroke-width="1" opacity="0.20"/>

  <!-- Calculator button grid: 3 × 3 (col x: 170,235,300 / row y: 248,296,344 / btn: 57×40) -->

  <!-- Row 0 -->
  <rect x="170" y="248" width="57" height="40" rx="8" fill="#112236" stroke="#38bdf8" stroke-width="0.8" opacity="0.9"/>
  <text x="198" y="275" font-family="'DM Mono','Courier New',monospace" font-size="19" text-anchor="middle" fill="#38bdf8" opacity="0.45">7</text>

  <rect x="235" y="248" width="57" height="40" rx="8" fill="#112236" stroke="#38bdf8" stroke-width="0.8" opacity="0.9"/>
  <text x="263" y="275" font-family="'DM Mono','Courier New',monospace" font-size="19" text-anchor="middle" fill="#38bdf8" opacity="0.45">8</text>

  <rect x="300" y="248" width="57" height="40" rx="8" fill="#112236" stroke="#38bdf8" stroke-width="0.8" opacity="0.9"/>
  <text x="328" y="275" font-family="'DM Mono','Courier New',monospace" font-size="19" text-anchor="middle" fill="#38bdf8" opacity="0.45">9</text>

  <!-- Row 1 -->
  <rect x="170" y="296" width="57" height="40" rx="8" fill="#112236" stroke="#38bdf8" stroke-width="0.8" opacity="0.9"/>
  <text x="198" y="323" font-family="'DM Mono','Courier New',monospace" font-size="19" text-anchor="middle" fill="#38bdf8" opacity="0.45">4</text>

  <!-- CENTER KEY: $ — the hero button -->
  <rect x="235" y="296" width="57" height="40" rx="8" fill="#166534" stroke="#22c55e" stroke-width="1.8" filter="url(#btnGlow)"/>
  <text x="264" y="325" font-family="'Arial Black',Arial,sans-serif" font-size="26" font-weight="900" text-anchor="middle" fill="#f0fdf4">$</text>

  <rect x="300" y="296" width="57" height="40" rx="8" fill="#112236" stroke="#38bdf8" stroke-width="0.8" opacity="0.9"/>
  <text x="328" y="323" font-family="'DM Mono','Courier New',monospace" font-size="19" text-anchor="middle" fill="#38bdf8" opacity="0.45">6</text>

  <!-- Row 2 -->
  <rect x="170" y="344" width="57" height="40" rx="8" fill="#112236" stroke="#38bdf8" stroke-width="0.8" opacity="0.9"/>
  <text x="198" y="371" font-family="'DM Mono','Courier New',monospace" font-size="19" text-anchor="middle" fill="#38bdf8" opacity="0.45">1</text>

  <rect x="235" y="344" width="57" height="40" rx="8" fill="#112236" stroke="#38bdf8" stroke-width="0.8" opacity="0.9"/>
  <text x="263" y="371" font-family="'DM Mono','Courier New',monospace" font-size="19" text-anchor="middle" fill="#38bdf8" opacity="0.45">2</text>

  <rect x="300" y="344" width="57" height="40" rx="8" fill="#112236" stroke="#38bdf8" stroke-width="0.8" opacity="0.9"/>
  <text x="328" y="371" font-family="'DM Mono','Courier New',monospace" font-size="19" text-anchor="middle" fill="#38bdf8" opacity="0.45">3</text>

  <!-- Door handle (right edge of panel) -->
  <rect x="371" y="295" width="5" height="22" rx="2.5" fill="#38bdf8" opacity="0.46"/>
  <rect x="366" y="303" width="20" height="7" rx="3.5" fill="#38bdf8" opacity="0.68"/>

  <!-- AI sparkle constellation — upper right of canvas -->
  <g filter="url(#sparkleGlow)">
    <path d="M0,-20 L4.5,-4.5 L20,0 L4.5,4.5 L0,20 L-4.5,4.5 L-20,0 L-4.5,-4.5 Z"
          transform="translate(418,116)" fill="#38bdf8" opacity="0.80"/>
    <path d="M0,-10 L2.2,-2.2 L10,0 L2.2,2.2 L0,10 L-2.2,2.2 L-10,0 L-2.2,-2.2 Z"
          transform="translate(440,94)" fill="#7dd3fc" opacity="0.52"/>
    <circle cx="444" cy="136" r="3.5" fill="#38bdf8" opacity="0.30"/>
  </g>

  <!-- Bottom brand accent bar -->
  <rect x="180" y="426" width="152" height="4" rx="2" fill="#22c55e" opacity="0.46"/>
</svg>
